backend:
  name: git-gateway
  branch: main
  identity: https://navigate-business.netlify.app/.netlify/identity
  gateway_url: https://api.github.com
  site_domain: navigate-business.netlify.app

local_backend: true

collections:
  - name: "pages"
    label: "Pages"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Content", name: "body", widget: "markdown" }
      - { label: "SEO Title", name: "seoTitle", widget: "string", required: false }
      - { label: "SEO Keywords", name: "seoKeywords", widget: "string", required: false }

  - name: "testimonials"
    label: "Testimonials"
    folder: "src/content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - { label: "Quote", name: "quote", widget: "text" }
      - { label: "Rating", name: "rating", widget: "number", min: 1, max: 5 }

  - name: "services"
    label: "Services"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Icon", name: "icon", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["individual", "organisation"] }

  - name: "settings"
    label: "Settings"
    folder: "src/content/settings"
    create: false
    delete: false
    slug: "{{slug}}"
    fields:
      - { label: "Site Title", name: "siteTitle", widget: "string" }
      - { label: "Site Description", name: "siteDescription", widget: "text" }
      - { label: "Contact Email", name: "contactEmail", widget: "string" }
      - { label: "Contact Phone", name: "contactPhone", widget: "string" }
      - { label: "Address", name: "address", widget: "text" }

media_folder: "public/uploads"
public_path: "/uploads"

login_backend: true
site_url: https://navigate-business.netlify.app
logo_url: https://navigate-business.netlify.app/logo.png
