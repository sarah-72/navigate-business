content: |
  Stop wasting hours wondering what to post and start creating content with confidence. This practical workshop gives you a simple content system that helps you plan, create and repurpose engaging content without feeling overwhelmed. You'll learn how to create stronger hooks, write captions faster, build a consistent content routine and use AI tools to support your creativity. You'll leave with practical templates, a content plan and a clear strategy you can use immediately.

