content: |
  Discover how AI can become a practical tool in your business without the confusion or technical jargon. This hands-on workshop will show you how to choose the right AI tools, create marketing content faster, streamline everyday admin tasks and build simple workflows that save you time. You'll leave with practical prompts, ready-to-use templates, a digital workbook and the confidence to start using AI effectively in your business from day one.

